spring.application.name=fusex-datasphere
spring.docker.compose.file=./compose.dev.yaml
spring.docker.compose.lifecycle-management=start-and-stop

fusex.divergencia.limite-baixa=5
fusex.divergencia.limite-media=15

fusex.guia.validade-dias=60
fusex.auth.token-validade-horas=8

# Origens do CORS separadas por vírgula, sem espaço
fusex.cors.origens=http://localhost:5173,http://localhost
